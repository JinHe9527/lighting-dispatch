server {
    listen 80;
    listen [::]:80;
    server_name wuyoupaiban.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://wuyoupaiban.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wuyoupaiban.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wuyoupaiban.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuyoupaiban.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
