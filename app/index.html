  panel.dataset.lightingOwners="1";
  const intro=heading.parentElement?.querySelector("p");
  if(intro)intro.textContent="按团队设置直播间和本职灯光师；自动派单优先本职负责人，但管理员和组长仍可安排任意可派成员";
  const table=panel.querySelector(".data-table");
  const headRow=table?.querySelector("thead tr");
  if(!table||!headRow)return;
  const ownerHead=document.createElement("th");
  ownerHead.textContent="本职灯光师";
  headRow.insertBefore(ownerHead,headRow.lastElementChild);
  const owners=(state.staff||[]).filter(person=>person.grp==="灯光组"&&!Number(person.intern));
  table.querySelectorAll("tbody tr").forEach(row=>{
    const teamId=Number(row.querySelector('[data-entity="teams"][data-field="name"]')?.dataset.id);
    const team=(state.teams||[]).find(item=>Number(item.id)===teamId);
    if(!team)return;
    const cell=document.createElement("td");
    cell.className="lighting-owner-cell";
    cell.dataset.label="本职灯光师";
    const select=document.createElement("select");
    select.dataset.entity="teams";
    select.dataset.id=String(team.id);
    select.dataset.field="lighting_owner_id";
    select.setAttribute("aria-label",`${team.name}的本职灯光师`);
    select.innerHTML='<option value="">未指定</option>'+owners.map(person=>`<option value="${esc(person.open_id)}" ${person.open_id===team.lighting_owner_id?"selected":""}>${esc(person.name)}</option>`).join("");
    cell.appendChild(select);
    row.insertBefore(cell,row.lastElementChild)
  })
}

const READ_ONLY_CONTROLS=[
  "[data-transfer]","[data-direct-assign]","[data-unassign-order]","[data-take]","[data-start]","[data-complete]",
  "[data-report-start]","[data-review-approve]","[data-review-reject]","[data-review-reopen]","[data-review-correct]",
  "[data-user]","[data-identity]","[data-leave]","[data-rest]","[data-entity]","[data-delete]",
  "[data-rule]","[data-rulenum]","[data-navvis]","[data-account-config]","[data-book]","[data-quick]",
  "[data-schedule-edit]","[data-plan-person]","[data-schedule-worker]","#scheduleSave",
  "#quickNew","#placeOrder","#addTeam","#addSla",
  "#addShift","#addGroup","#setReminderOn","#setReminderMin","#setUrgentOn","#gateMode","#deptIds","#purgeOrders",
  "#qsGo","#dmTask","#dmUrgent","#dmSaveBtn","#dmTransferBtn","#dmApproveBtn",
  "#dmRejectBtn","#dmAcceptBtn","#dmWithdrawBtn","#dmDisputeBtn","#dmCancelBtn","#doneSubmit","#reportStartSubmit",
  "#correctedSubmit","#transferSubmit"
].join(",");

function applyReadOnlyUi(){
  if(!me||!Number(me.read_only))return;
  const shell=document.querySelector(".app-shell");
  if(shell)shell.classList.add("is-readonly");
  const role=document.querySelector(".user-meta span");
  if(role&&role.textContent!=="管理层只读")role.textContent="管理层只读";
  const workspace=document.querySelector(".workspace");
  if(workspace&&!workspace.querySelector(".readonly-banner")){
    const banner=document.createElement("div");
    banner.className="banner readonly-banner";
    banner.innerHTML="<strong>管理层只读</strong>你可以查看全部管理端内容；派单、改人员、改配置和删除等操作已锁定。";
    workspace.prepend(banner);
  }
  document.querySelectorAll(READ_ONLY_CONTROLS).forEach(control=>{
    control.disabled=true;
    control.setAttribute("aria-disabled","true");
  });
  document.querySelectorAll(".req-form input,.req-form select,.req-form textarea,#qsheetMask input,#qsheetMask select,#qsheetMask textarea").forEach(control=>{
    control.disabled=true;
  });
}

new MutationObserver(()=>{
  const shell=document.querySelector(".app-shell");
  if(shell&&shell.classList.contains("offline")!==!connectionOnline)setConnectionState(connectionOnline,false);
  applyReadOnlyUi();
  applyCrewGovernanceUi();
  applyDispatchSearch();
}).observe(document.body,{childList:true,subtree:true});

document.addEventListener("click",event=>{
  const button=event.target.closest?.("[data-profile]");
  if(!button)return;
  event.preventDefault();
  event.stopImmediatePropagation();
  runButtonAction(button,"登录中…",async()=>{
    try{
      const response=await fetchWithTimeout("/auth/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:button.dataset.profile})});
      const result=await response.json().catch(()=>({ok:false,msg:"服务响应异常"}));
      if(!response.ok||!result.ok){
        showToast(result.msg||"登录失败");
        return
      }
      setConnectionState(true);
      await load()
    }catch(error){
      setConnectionState(false,false);
      showToast(error&&error.name==="TimeoutError"?"登录请求超时，请重试":"网络连接失败，请检查网络后重试")
    }
  })
},true);
document.addEventListener("click",event=>{
  const target=event.target.closest?.("[data-range],[data-statsgrp],[data-person]");
  if(!target)return;
  if(target.matches("[data-range],[data-statsgrp]")){
    statsError="";
    statsPersonError=""
  }else if(target.matches("[data-person]")){
    statsPersonError=""
  }
},true);
document.addEventListener("click",event=>{
  const button=event.target.closest?.("[data-retry-load]");
  if(!button)return;
  const action=button.dataset.retryLoad;
  if(action==="schedule"){
    schedError="";
    schedDataKey=""
  }else if(action==="stats"){
    statsError="";
    statsData=null
  }else if(action==="stats-person"){
    statsPersonError="";
    statsPersonData=null
  }else if(action==="audit"){
    auditError="";
    auditRows=null
  }
  renderApp()
});
document.addEventListener("click",event=>{
  const button=event.target.closest?.("[data-goto]");
  if(!button)return;
  event.preventDefault();
  event.stopImmediatePropagation();
  navigatePage(button.dataset.goto)
},true);
document.addEventListener("click",event=>{
  const button=event.target.closest?.("[data-request-config]");
  if(!button)return;
  cfgSec=button.dataset.requestConfig;
  navigatePage("settings")
});
document.addEventListener("click",event=>{
  const target=event.target.closest?.("[data-auditcat],[data-range],[data-statsgrp],[data-person],[data-filter],[data-boardgrp],[data-schedview],[data-schedule-nav],[data-schedule-today],[data-select-calendar-day],[data-open-calendar-day],[data-cfggrp],[data-cfgsec],[data-crew-section]");
  if(!target)return;
  setTimeout(()=>{if(state&&me)syncPageUrl("push")},0)
},true);
window.addEventListener("offline",()=>setConnectionState(false,true));
window.addEventListener("online",()=>load(false));
document.addEventListener("change",event=>{
  const select=event.target;
  if(select.id==="scheduleDateJump"){
    if(validIsoDate(select.value)){
      schedDate=select.value;
      schedError="";
      renderApp();
      syncPageUrl("push")
    }
    return
  }
  if(select.id==="dispatchStatusSelect")window.dispatchFilter=select.value;
  else if(select.id==="statsGroupSelect"){
    statsGroup=select.value;
    statsData=null;
    statsPerson=null;
    statsPersonData=null
  }
  else if(select.id==="settingsSectionSelect")cfgSec=select.value;
  else if(select.id==="auditCategorySelect")auditCat=select.value;
  else return;
  renderApp();
  syncPageUrl("push")
});
document.addEventListener("input",event=>{
  if(event.target.id==="crewSearch"){
    crewQuery=event.target.value.slice(0,80);
    syncPageUrl("replace");
    applyCrewSearch()
  }else if(event.target.id==="dispatchSearch"){
    dispatchQuery=event.target.value.slice(0,80);
    syncPageUrl("replace");
    applyDispatchSearch()
  }
});
document.addEventListener("input",event=>{if(page==="request"&&event.target.closest?.(".req-form"))requestDirty=true});
document.addEventListener("change",event=>{if(page==="request"&&event.target.closest?.(".req-form"))requestDirty=true});
document.addEventListener("click",event=>{if(page==="request"&&event.target.closest?.("[data-reqgroup],[data-when],[data-day]"))requestDirty=true});
document.addEventListener("click",event=>{const button=event.target.closest?.("[data-crew-section]");if(!button)return;crewSection=button.dataset.crewSection;renderApp()});
["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev,unlockAudio,{once:true}));load();setInterval(()=>load(true),5000);
</script>
